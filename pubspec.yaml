name: mentorix_app
description: "Mentorix — мобильное приложение."
publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: ^3.11.4

dependencies:
  flutter:
    sdk: flutter

  cupertino_icons: ^1.0.8

  # Состояние: только Cubit, без Bloc-событий
  flutter_bloc: ^9.1.1
  equatable: ^2.0.8

  # DI
  get_it: ^9.2.0

  # Навигация
  go_router: ^17.2.3

  # Сеть (свой API)
  dio: ^5.9.0

  # Локализация: ru + en
  flutter_localizations:
    sdk: flutter
  intl: ^0.20.2

  # Хранилище: токены — только в secure storage, остальное — в shared_preferences
  flutter_secure_storage: ^9.2.4
  shared_preferences: ^2.5.3

  # Вход через Google и Apple
  google_sign_in: ^7.2.0
  sign_in_with_apple: ^8.1.0

  # Открытие внешних ссылок (бот Telegram)
  url_launcher: ^6.3.3

  # Логотипы (SVG) и брендовые иконки
  flutter_svg: ^2.2.1
  font_awesome_flutter: ^11.0.0

dev_dependencies:
  flutter_test:
    sdk: flutter

  flutter_lints: ^6.0.0

  # Нативный сплеш и иконка приложения (команды — в README)
  flutter_native_splash: ^2.4.7
  flutter_launcher_icons: ^0.14.4

flutter:
  uses-material-design: true

  # Генерация AppLocalizations из lib/l10n/*.arb (настройки — в l10n.yaml)
  generate: true

  assets:
    - assets/icons/
    # PNG логотипа для нативного сплеша и Flutter-сплеша: один и тот же файл,
    # поэтому переход между ними не меняет ни размер, ни положение логотипа.
    - assets/splash/

  # Inter встроен в приложение (лицензия SIL OFL — assets/fonts/OFL.txt): шрифт
  # есть в первом кадре, без скачивания и без подмены системным. Статические
  # начертания оптического размера 18 pt подходят всей шкале 12–24 sp;
  # веса: 400 — текст, 500 — кнопки, 600 — заголовки.
  fonts:
    - family: Inter
      fonts:
        - asset: assets/fonts/Inter_18pt-Regular.ttf
          weight: 400
        - asset: assets/fonts/Inter_18pt-Medium.ttf
          weight: 500
        - asset: assets/fonts/Inter_18pt-SemiBold.ttf
          weight: 600
